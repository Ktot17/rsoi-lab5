name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build
        working-directory: src
        run: dotnet build --no-restore -c Release

      - name: Run unit tests
        working-directory: src
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate to Yandex Cloud
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' > key.json
          yc config profile create sa-profile
          yc config set service-account-key key.json --profile sa-profile
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }} --profile sa-profile
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }} --profile sa-profile
          yc config profile activate sa-profile
          rm -f key.json

      - name: Login to Yandex Container Registry
        run: |
          yc iam create-token | docker login --username iam --password-stdin cr.yandex

      - name: Setup kubectl
        run: |
          yc managed-kubernetes cluster get-credentials \
            ${{ secrets.KUBE_CLUSTER_ID }} \
            --external \
            --force
          kubectl cluster-info

      - name: Build images
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        timeout-minutes: 10
        run: docker compose build --push

      - name: Deploy with Helm
        run: |
          helm upgrade --install rating     ./helm/app -f ./helm/values/rating.yaml      --wait --timeout 3m
          helm upgrade --install library    ./helm/app -f ./helm/values/library.yaml     --wait --timeout 3m
          helm upgrade --install reservation ./helm/app -f ./helm/values/reservation.yaml --wait --timeout 3m
          helm upgrade --install gateway    ./helm/app -f ./helm/values/gateway.yaml     --wait --timeout 3m

      - name: Wait before services are ready
        run: kubectl wait -l app.kubernetes.io/instance=gateway pod --for=condition=Ready --timeout=3m

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v4/postman/collection.json
          environment: v4/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 5
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"